name: Release

# Bump `version` in build.yaml, commit, then push a matching tag:
#   git tag v1.0.0.0 && git push origin v1.0.0.0
# The workflow builds the plugin, publishes a GitHub release with the zip,
# and updates manifest.json on main so the plugin repository URL serves the new version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    env:
      PLUGIN_NAME: Jellyfin.Plugin.WakeOnLan
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jprm
        run: pip install jprm

      - name: Resolve version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          YAML_VERSION="$(sed -n 's/^version: *"\(.*\)"/\1/p' build.yaml)"
          if [ "$TAG_VERSION" != "$YAML_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match build.yaml version $YAML_VERSION" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Build plugin package
        run: |
          mkdir -p artifacts
          jprm --verbosity=debug plugin build . \
            --output=artifacts \
            --version="${{ steps.version.outputs.version }}" \
            --dotnet-framework=net10.0

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.zip

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Update manifest.json
        run: |
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/logo.png"
          cd main-branch
          # Make sure the catalog image points at this repository regardless of who forked it.
          sed -i "s#\"imageUrl\": *\"[^\"]*\"#\"imageUrl\": \"${IMAGE_URL}\"#" manifest.json
          jprm repo add --url="${BASE_URL}" manifest.json ../artifacts/*.zip
          # jprm writes "<base>/<plugin>/<zip>" but GitHub release assets are flat: "<base>/<zip>".
          python3 - <<'EOF'
          import json, re
          with open("manifest.json") as f:
              manifest = json.load(f)
          for plugin in manifest:
              for version in plugin["versions"]:
                  version["sourceUrl"] = re.sub(r"/[^/]+/([^/]+\.zip)$", r"/\1", version["sourceUrl"])
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=4)
              f.write("\n")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish v${{ steps.version.outputs.version }} to plugin manifest"
          git push origin main
