version: "1.0.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Wake a sleeping storage server when Jellyfin needs it"
description: >
  Sends a Wake-on-LAN magic packet to your NAS or storage server whenever a client
  connects to Jellyfin or starts playback, so media on a sleeping server is available
  by the time it is requested. Optionally probes a TCP port first so no packet is sent
  when the server is already awake.
